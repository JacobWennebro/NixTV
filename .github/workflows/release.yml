# Builds the NixTV installer ISOs (x86_64 and aarch64, each on a native runner).
#  - Push a tag like v0.1.0: the ISOs are published as a GitHub release.
#  - Run it by hand (Actions → Release → Run workflow): the ISOs are kept as
#    workflow artifacts only, for testing.
# ISOs are named nixtv-<version>-<arch>.iso (nixtv-0.1.0-x86_64.iso), or
# nixtv-dev-<commit>-<arch>.iso for a run by hand.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso:
    name: ISO (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            system: x86_64-linux
            runner: ubuntu-latest
          - arch: aarch64
            system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build the ISO
        run: nix build --print-build-logs .#packages.${{ matrix.system }}.iso

      - name: Name it after the version
        id: name
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v} # v0.1.0 -> 0.1.0
          else
            version=dev-$(git rev-parse --short HEAD)
          fi
          iso="nixtv-${version}-${{ matrix.arch }}.iso"
          mkdir dist
          cp result/iso/*.iso "dist/$iso"
          echo "iso=$iso" >> "$GITHUB_OUTPUT"
          ls -lh dist

      # Uploaded as the .iso itself (no zip), so it downloads as one.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/${{ steps.name.outputs.iso }}
          archive: false
          retention-days: 14

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: iso
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: nixtv-*.iso
          path: dist
          merge-multiple: true

      - name: Write the checksums
        run: cd dist && sha256sum -- *.iso | tee SHA256SUMS

      - name: Write the release notes
        run: |
          rev=$(jq -r .nodes.nixpkgs.locked.rev flake.lock)
          cat > notes.md <<EOF
          NixTV is early in development and hasn't been tested thoroughly; see the README.

          **Install:** write the ISO for your CPU (\`x86_64\` for most PCs) to a USB stick,
          boot it, get online (\`nmtui\` for Wi-Fi) and run \`sudo nixtv-install\`. The ISO is
          small: everything else downloads during the install.

          Check the download with \`sha256sum -c SHA256SUMS --ignore-missing\`.

          **Source:** the ISOs contain free software from NixOS, each under its own license,
          built from nixpkgs commit [\`${rev:0:12}\`](https://github.com/NixOS/nixpkgs/tree/$rev).
          Its source, and the source for everything else in the ISO, is available there.
          EOF

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # v0.x and tags like v1.0.0-rc1 are marked as pre-releases.
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          body_path: notes.md
